server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  pricing:
    tax-rate: ${TAX_RATE:0}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

spring:
  application:
    name: coffeeshop-order-management
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT}/${MYSQL_DATABASE}    
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none