server:
  port: 8080

spring:
  application:
    name: coffeeshop-order-manageme
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true