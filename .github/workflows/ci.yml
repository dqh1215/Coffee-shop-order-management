name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # contextLoads test needs a real MySQL with the schema loaded
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: coffeeshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      MYSQL_DATABASE: coffeeshop
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: rootpassword
      ADMIN_EMAIL: admin@coffeeshop.local
      ADMIN_PASSWORD: ci-admin-password
      TAX_RATE: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Load schema and seed data
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpassword coffeeshop < infrastructure/database/init/01-schema.sql

      # Throwaway key generated per run, never stored
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: coffeeshop-order-management:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
