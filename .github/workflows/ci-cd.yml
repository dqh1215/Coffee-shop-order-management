name: CI/CD

# PR into dev: tests only. PR into main: tests + image build. Merge into main: tests + build + publish.
# Pushes to dev are not built separately, since the pull request already tests the same code.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    # contextLoads test needs a real MySQL with the schema loaded
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: coffeeshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      MYSQL_DATABASE: coffeeshop
      MYSQL_USERNAME: root
      MYSQL_ROOT_PASSWORD: rootpassword
      ADMIN_EMAIL: admin@coffeeshop.local
      ADMIN_PASSWORD: ci-admin-password
      TAX_RATE: 0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Load schema and seed data
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpassword coffeeshop < infrastructure/database/init/01-schema.sql

      # Throwaway key generated per run, never stored
      - name: Generate JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.base_ref == 'main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only build the image; pushes to main also publish it to GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main on push, pr-<number> on pull requests, plus the commit SHA
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dqh1215/coffee-shop-order-management
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
